[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-audit",
    "crates/cortex-mcp",
    "crates/cortex-hooks",
    "crates/cortex-migrate",
    "crates/cortex-similarity",
    "crates/cortex-spectral",
    "crates/cortex-active-memory",
    "crates/cortex-monitor",
    "crates/cortex-dream",
    "crates/cortex-handoff",
    "crates/cortex-episodic",
    "crates/cortex-confidence",
    "crates/cortex-graph",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Ember Research Lab <emberresearchlab@gmail.com>"]
repository = "https://github.com/ember-research-lab/claude-cortex"
homepage = "https://github.com/ember-research-lab/claude-cortex"
description = "Persistent memory that makes Claude Code smarter across sessions"

[workspace.dependencies]
# MCP server (official Rust SDK)
rmcp = { version = "0.16", features = ["server", "transport-io"] }

# Crypto / hashing
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
sha2 = "0.10"
blake3 = "1"
rand = "0.8"

# Shared org crypto surface (sign/verify/hash behind a crypto-agility interface). Cortex stays on
# Ed25519 for substrate compatibility, so it pulls the crate with PQC OFF (default-features = false).
ember-crypto = { git = "https://github.com/ember-research-lab/ember-crypto", tag = "v0.1.0", default-features = false }

# Shared org knowledge-graph engine — the token-budgeted relevance-query substrate for v-next
# retrieval (and, later, the unified memory+code graph). Core is zero-dep; crypto/spectral are opt-in.
ember-graph = { git = "https://github.com/ember-research-lab/ember-graph", tag = "v0.2.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "sync", "signal"] }

# Errors
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Base64
base64 = "0.22"

# Hex
hex = "0.4"

# JSON Schema (rmcp tool param schemas)
schemars = { version = "1", features = ["chrono04"] }

# v4 spectral layer (BM25 + sparse linear algebra; no embedding model, no API).
nalgebra = "0.33"
nalgebra-sparse = "0.10"

# Internal v4 crates
cortex-similarity = { path = "crates/cortex-similarity" }
cortex-spectral = { path = "crates/cortex-spectral" }
cortex-active-memory = { path = "crates/cortex-active-memory" }
cortex-monitor = { path = "crates/cortex-monitor" }
cortex-handoff = { path = "crates/cortex-handoff" }
cortex-confidence = { path = "crates/cortex-confidence" }

# Filesystem helpers
tempfile = "3"
fs2 = "0.4"

# Internal
cortex-core = { path = "crates/cortex-core" }
cortex-episodic = { path = "crates/cortex-episodic" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-hooks]
inherits = "release"
opt-level = "z"
lto = "fat"
