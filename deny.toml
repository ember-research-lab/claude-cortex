# cargo-deny configuration — supply-chain policy.
# CI runs: advisories + bans + sources. Enable `licenses` once the allow-list below is tuned.
[advisories]
version = 2
ignore = [
    # `paste` (proc macro, transitive via nalgebra -> simba) is archived but
    # functional; build-time only, no runtime exposure. Revisit if nalgebra
    # swaps it out upstream.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; build-time proc macro via nalgebra/simba" },
    # rmcp DNS-rebinding (CVE-2026-42559) affects ONLY the Streamable HTTP server
    # transport. cortex-mcp uses stdio exclusively (feature `transport-io`); the
    # advisory explicitly states "non-HTTP transports such as stdio ... are not
    # affected." Patched in rmcp 1.4.0 — a major upgrade from 0.16 (full server
    # rewrite) tracked separately; not applicable to our attack surface.
    { id = "RUSTSEC-2026-0189", reason = "rmcp DNS-rebinding is HTTP-transport only; cortex-mcp is stdio-only (unaffected per advisory). Fix is rmcp 1.4.0, a major migration tracked separately." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "..."` deps carry no version and register as
# wildcards; allow those while still denying registry/git wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Org-internal shared crypto crate (public repo, MIT). Pinned by tag in the workspace manifest.
allow-git = [
    "https://github.com/ember-research-lab/ember-crypto",
    "https://github.com/ember-research-lab/ember-graph",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = ["MIT","Apache-2.0","Apache-2.0 WITH LLVM-exception","BSD-2-Clause","BSD-3-Clause","ISC","Unicode-3.0","Zlib","MPL-2.0","CC0-1.0"]
