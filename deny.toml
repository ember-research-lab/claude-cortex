# cargo-deny configuration — supply-chain policy.
# CI runs: advisories + bans + sources. Enable `licenses` once the allow-list below is tuned.
[advisories]
version = 2
ignore = [
    # `paste` (proc macro, transitive via nalgebra -> simba) is archived but
    # functional; build-time only, no runtime exposure. Revisit if nalgebra
    # swaps it out upstream.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; build-time proc macro via nalgebra/simba" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "..."` deps carry no version and register as
# wildcards; allow those while still denying registry/git wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Org-internal shared crypto crate (public repo, MIT). Pinned by tag in the workspace manifest.
allow-git = ["https://github.com/ember-research-lab/ember-crypto"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = ["MIT","Apache-2.0","Apache-2.0 WITH LLVM-exception","BSD-2-Clause","BSD-3-Clause","ISC","Unicode-3.0","Zlib","MPL-2.0","CC0-1.0"]
